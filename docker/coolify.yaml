# documentation: https://kaletacms.com/guide/install
# slogan: Open-source CMS for business websites – a visual builder, a design system and Claude as your editor.
# category: cms
# tags: cms, website, builder, php, mariadb, mcp, claude
# logo: svgs/kaleta.svg
# port: 80
#
# Kaleta for Coolify (2.5): paste as a Docker Compose resource. The first start installs the site on its own –
# Coolify generates the address, the database credentials and the administrator's password (Environment Variables:
# SERVICE_PASSWORD_ADMIN, sign-in name admin). Change the password after the first sign-in. For newsletters add a
# Scheduled task with the line from Settings → System status.

services:
  kaleta:
    image: ghcr.io/phprs-cms/kaleta:latest
    environment:
      - SERVICE_URL_KALETA_80
      - KALETA_URL=${SERVICE_URL_KALETA}
      - KALETA_DB_HOST=mariadb
      - KALETA_DB_NAME=${MARIADB_DATABASE:-kaleta}
      - KALETA_DB_USER=${SERVICE_USER_MARIADB}
      - KALETA_DB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
      - KALETA_ADMIN_USER=${KALETA_ADMIN_USER:-admin}
      - KALETA_ADMIN_EMAIL=${KALETA_ADMIN_EMAIL:-}
      - KALETA_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - KALETA_SITE_NAME=${KALETA_SITE_NAME:-}
      - KALETA_LANGUAGE=${KALETA_LANGUAGE:-en}
      - KALETA_STARTER=${KALETA_STARTER:-firemni}
    volumes:
      - kaleta-site:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/robots.txt') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 30
  mariadb:
    image: mariadb:11.4
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE:-kaleta}
      - MARIADB_USER=${SERVICE_USER_MARIADB}
      - MARIADB_PASSWORD=${SERVICE_PASSWORD_MARIADB}
      - MARIADB_RANDOM_ROOT_PASSWORD=1
    volumes:
      - kaleta-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  kaleta-site:
  kaleta-db:
