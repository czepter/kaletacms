# Kontrola každé změny: syntaxe a kouřový test na podporovaných verzích PHP, bezpečnostní statická analýza,
# hlídání tajemství v repozitáři. Jednou týdně běží i bez změn - odhalí problém s novou verzí PHP nebo MySQL.
name: Kontrola
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: 'pdo_mysql, mbstring, gd, zip, sodium, intl, exif', coverage: none }
      - name: Kouřový test (čistá instalace a průchod stránkami)
        run: tools/test.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
      - name: Anglická administrace bez češtiny
        run: tools/test-english.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
      - name: Browser test (admin, builder, editors, public site in Chrome)
        run: tools/test-browser.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, CHROME: /usr/bin/google-chrome }
      - name: Output budget (Lighthouse on every starter site)
        if: matrix.php == '8.4'
        run: tools/test-lighthouse.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, CHROME: /usr/bin/google-chrome }
  migrace:
    # aktualizace databáze starší verze na současnou (tools/test-migrations.sh) na MySQL i MariaDB, jaké mívají hostingy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { image: 'mysql:8.4', health: 'mysqladmin ping -proot' }
          - { image: 'mariadb:10.6', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized' }
    services:
      db:
        image: ${{ matrix.db.image }}
        env: { MYSQL_ROOT_PASSWORD: root, MARIADB_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="${{ matrix.db.health }}" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, gd, intl, zip, sodium', coverage: none }
      - name: Aktualizace databáze z 1.0.0 na současnou verzi
        run: tools/test-migrations.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, FROM: v1.0.0 }
      - name: Update from the previous release through the admin
        run: tools/test-update.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
      - name: Update from 1.0.0 through the admin
        run: tools/test-update.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, FROM: v1.0.0 }
  docker:
    # the image builds, starts with MariaDB (compose.yaml), installs and serves the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, start and install
        env: { KALETA_DB_PASSWORD: docker-test }
        run: |
          docker compose up -d --build --wait
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/install.php && break; sleep 1; done
          curl -s -o /tmp/install.html -X POST http://localhost:8080/install.php -d jazyk=en -d db_host=db -d db_port=3306 -d db_name=kaleta -d db_user=kaleta \
            -d db_password=docker-test -d db_prefix=ka_ -d nazev_webu=Docker -d web=firemni -d user=admin -d jmeno=Tester -d email= \
            -d password=Docker-test-2026 -d password2=Docker-test-2026 -d 'rozsireni[]=novinky' -d 'rozsireni[]=poptavky'
          grep -q "Done, your website is running" /tmp/install.html || { sed 's/<[^>]*>//g' /tmp/install.html | grep -v '^\s*$' | head -20; exit 1; }
          curl -sf -o /tmp/home.html http://localhost:8080/ && grep -q '<title>' /tmp/home.html
          curl -sf -o /dev/null http://localhost:8080/admin.php
          curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/about-us | grep -q 200
          curl -sI http://localhost:8080/ | grep -qi '^x-content-type-options'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
  phpstan:
    # static analysis (phpstan.neon.dist): level 5, the findings of 2.1.0 in phpstan-baseline.neon – new code adds none
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, gd, zip, sodium, intl, exif', coverage: none }
      - name: PHPStan
        run: |
          curl -sSL -o /tmp/phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.30/phpstan.phar
          php -d memory_limit=2G /tmp/phpstan.phar analyse -c phpstan.neon.dist --no-progress
  bezpecnost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Semgrep - bezpečnostní pravidla pro PHP a JavaScript
        uses: returntocorp/semgrep-action@v1
        with: { config: 'p/php p/javascript p/secrets p/owasp-top-ten' }
      - name: Gitleaks - v repozitáři nesmí být klíče ani hesla
        # přímo program: hotová akce gitleaks-action chce u organizací placenou licenci
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner
      - name: Soukromý klíč vydavatele není v gitu
        run: '! git ls-files | grep -E "tools/klice|\.key$"'
