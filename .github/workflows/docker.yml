# Docker image of a release: when a release is published, its signed package (kaleta-X.Y.Z.zip, with the file list the
# integrity check and the updater use) goes into ghcr.io/phprs-cms/kaleta:X.Y.Z and :latest. Can be run again by hand.
name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: 'Release tag, e.g. v2.1.0', required: true }

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ env.TAG }}' }
      - name: The signed release package as the build context
        run: |
          gh release download "$TAG" -p 'kaleta-*.zip' -D /tmp/package
          mkdir /tmp/context && unzip -q /tmp/package/kaleta-*.zip -d /tmp/context
          cp -r Dockerfile docker /tmp/context/
      - name: Build and push
        run: |
          VERSION="${TAG#v}"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "ghcr.io/phprs-cms/kaleta:$VERSION" /tmp/context
          docker push "ghcr.io/phprs-cms/kaleta:$VERSION"
          if [ "${{ github.event.release.prerelease }}" != "true" ]; then
            docker tag "ghcr.io/phprs-cms/kaleta:$VERSION" ghcr.io/phprs-cms/kaleta:latest
            docker push ghcr.io/phprs-cms/kaleta:latest
          fi
