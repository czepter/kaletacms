# Kaleta with MariaDB: docker compose up -d, then open http://localhost:8080 and fill in the installer
#   Database server: db · Database: kaleta · User: kaleta · Password: the KALETA_DB_PASSWORD below
# The site (files, media, config.php) is in the volume "site", the database in "data". Updates: Settings → Backups and
# updates in the admin, as on any hosting. For newsletters, schedule the line from Settings → System status (cron) on the
# host or in your platform (Coolify: Scheduled tasks).
services:
  kaleta:
    image: ghcr.io/phprs-cms/kaleta:latest
    build: .
    ports:
      - "${KALETA_PORT:-8080}:80"
    volumes:
      - site:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: kaleta
      MARIADB_USER: kaleta
      MARIADB_PASSWORD: ${KALETA_DB_PASSWORD:?set KALETA_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    restart: unless-stopped
volumes:
  site:
  data:
