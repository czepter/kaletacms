# Kaleta with MariaDB: KALETA_DB_PASSWORD=… docker compose up -d, then open http://localhost:8080 and fill in the installer
# (the database is already set – only the site and the administrator are asked for).
# Without the browser: also set KALETA_URL (the address of the site) and KALETA_ADMIN_PASSWORD, optionally KALETA_ADMIN_USER,
# KALETA_ADMIN_EMAIL, KALETA_SITE_NAME, KALETA_LANGUAGE (en, cs, de) and KALETA_STARTER – the first start installs the site.
# Change the password after the first sign-in and remove KALETA_ADMIN_PASSWORD; it is not used again.
# The site (files, media, config.php) is in the volume "site", the database in "data". Updates: Settings → Backups and
# updates in the admin, as on any hosting. For newsletters, schedule the line from Settings → System status (cron) on the
# host or in your platform (Coolify: Scheduled tasks).
services:
  kaleta:
    image: ghcr.io/phprs-cms/kaleta:latest
    build: .
    ports:
      - "${KALETA_PORT:-8080}:80"
    environment:
      KALETA_DB_HOST: db
      KALETA_DB_NAME: kaleta
      KALETA_DB_USER: kaleta
      KALETA_DB_PASSWORD: ${KALETA_DB_PASSWORD:?set KALETA_DB_PASSWORD}
      KALETA_URL: ${KALETA_URL:-}
      KALETA_ADMIN_USER: ${KALETA_ADMIN_USER:-admin}
      KALETA_ADMIN_EMAIL: ${KALETA_ADMIN_EMAIL:-}
      KALETA_ADMIN_PASSWORD: ${KALETA_ADMIN_PASSWORD:-}
      KALETA_SITE_NAME: ${KALETA_SITE_NAME:-}
      KALETA_LANGUAGE: ${KALETA_LANGUAGE:-en}
      KALETA_STARTER: ${KALETA_STARTER:-firemni}
    volumes:
      - site:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: kaleta
      MARIADB_USER: kaleta
      MARIADB_PASSWORD: ${KALETA_DB_PASSWORD:?set KALETA_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    restart: unless-stopped
volumes:
  site:
  data:
